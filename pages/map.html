<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a12">
    <title>ClimateGuard - Weather Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        body { background: #0a0a12; color: #fff; }
        .map-wrap { position: fixed; top: 60px; left: 0; right: 0; bottom: 64px; z-index: 1; }
        #map { width: 100%; height: 100%; background: #0a0a12; }
        .leaflet-container { background: #0a0a12; }
        .weather-marker { background: none !important; border: none !important; }

        .map-controls {
            position: fixed; top: 76px; right: 14px; z-index: 1000;
            display: flex; flex-direction: column; gap: 6px;
        }
        .map-btn {
            width: 42px; height: 42px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(10,10,18,0.85); backdrop-filter: blur(16px);
            color: #fff; cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 1rem; transition: all 0.2s;
        }
        .map-btn:hover { background: rgba(255,255,255,0.12); transform: scale(1.05); }
        .map-btn.active { background: #2bd4a7; color: #062c23; border-color: #2bd4a7; box-shadow: 0 4px 16px rgba(43,212,167,0.3); }

        .map-info {
            position: fixed; bottom: 80px; left: 14px; right: 14px; max-width: 400px;
            background: rgba(10,10,18,0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 16px; z-index: 1000;
            transform: translateY(140%); transition: transform 0.3s ease;
        }
        .map-info.show { transform: translateY(0); }
        .map-info-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .map-info-stats { display:flex; gap:12px; flex-wrap:wrap; }
        .map-info-stat { flex:1; min-width:60px; text-align:center; }
        .map-info-stat .label { font-size:0.6rem; text-transform:uppercase; letter-spacing:0.06em; color:rgba(255,255,255,0.5); }
        .map-info-stat .val { font-size:1.2rem; font-weight:700; margin-top:2px; }
        .close-info { background:rgba(255,255,255,0.08); border:none; color:#fff; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:0.8rem; }

        .map-legend {
            position: fixed; bottom: 80px; left: 14px; max-width: 260px;
            background: rgba(10,10,18,0.92); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
            padding: 12px 14px; z-index: 999;
        }
        .legend-title { font-size:0.6rem; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.5); margin-bottom:8px; }
        .legend-bar { height:6px; border-radius:3px; margin-bottom:4px; }
        .legend-labels { display:flex; justify-content:space-between; font-size:0.6rem; color:rgba(255,255,255,0.4); }

        .navbar { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; position:fixed; top:0; left:0; right:0; z-index:50; background:rgba(10,10,18,0.85); backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,0.08); }
        .navbar__logo { display:flex; align-items:center; gap:8px; font-weight:700; font-size:1.05rem; }
        .navbar__logo i { color:#2bd4a7; }

        .tab-bar { position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:space-around; padding:12px 0 calc(16px + env(safe-area-inset-bottom)); background:rgba(10,10,18,0.95); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.08); z-index:100; }
        .tab-item { display:flex; flex-direction:column; align-items:center; gap:3px; color:rgba(255,255,255,0.5); font-size:0.6rem; font-weight:600; text-decoration:none; padding:4px 12px; }
        .tab-item i { font-size:1.15rem; }
        .tab-item.active { color:#2bd4a7; }

        #mapDemoBadge {
            position: fixed; top: 76px; left: 14px; z-index: 1000;
            background: rgba(234,179,8,0.15); border: 1px solid rgba(234,179,8,0.4);
            color: #fbbf24; padding: 6px 12px; border-radius: 20px;
            font-size: 0.7rem; font-weight: 600;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar__logo"><i class="fa-solid fa-shield-halved"></i><span>ClimateGuard</span></div>
        <span style="font-weight:600; font-size:0.85rem; opacity:0.8;" data-i18n="weatherMap">Weather Map</span>
        <button class="map-btn" style="width:36px;height:36px;font-size:0.85rem;" onclick="location.href='search.html'"><i class="fa-solid fa-magnifying-glass"></i></button>
    </nav>

    <div class="map-wrap"><div id="map"></div></div>

    <div id="mapDemoBadge">⚠ Demo mode — live layers need an API key</div>

    <div class="map-controls">
        <button class="map-btn" id="locateBtn" title="My Location"><i class="fa-solid fa-location-crosshairs"></i></button>
        <div style="height:4px;"></div>
        <button class="map-btn active" data-layer="temp" title="Temperature"><i class="fa-solid fa-temperature-half"></i></button>
        <button class="map-btn" data-layer="wind" title="Wind"><i class="fa-solid fa-wind"></i></button>
        <button class="map-btn" data-layer="precip" title="Precipitation"><i class="fa-solid fa-cloud-rain"></i></button>
        <button class="map-btn" data-layer="clouds" title="Clouds"><i class="fa-solid fa-cloud"></i></button>
        <div style="height:4px;"></div>
        <button class="map-btn" id="riskBtn" title="Risk Zones"><i class="fa-solid fa-triangle-exclamation"></i></button>
    </div>

    <div class="map-info" id="mapInfo">
        <div class="map-info-head">
            <div style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-circle-info" style="color:#2bd4a7;"></i><strong id="infoName">City</strong></div>
            <button class="close-info" id="closeInfo"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="map-info-stats">
            <div class="map-info-stat"><div class="label">Temp</div><div class="val" id="infoTemp">--</div></div>
            <div class="map-info-stat"><div class="label">Wind</div><div class="val" id="infoWind">--</div></div>
            <div class="map-info-stat"><div class="label">Humidity</div><div class="val" id="infoHum">--</div></div>
            <div class="map-info-stat"><div class="label">Risk</div><div class="val" id="infoRisk">--</div></div>
        </div>
    </div>

    <div class="map-legend" id="legend">
        <div class="legend-title" id="legendTitle">Temperature (°C)</div>
        <div class="legend-bar" id="legendBar" style="background:linear-gradient(to right,#3b82f6,#06b6d4,#22c55e,#eab308,#f97316,#ef4444);"></div>
        <div class="legend-labels" id="legendLabels"><span>-20</span><span>0</span><span>15</span><span>25</span><span>35</span><span>45+</span></div>
    </div>

    <nav class="tab-bar">
        <a href="index.html" class="tab-item"><i class="fa-solid fa-house"></i><span data-i18n="home">Home</span></a>
        <a href="map.html" class="tab-item active"><i class="fa-solid fa-map-location-dot"></i><span data-i18n="map">Map</span></a>
        <a href="risk-report.html" class="tab-item"><i class="fa-solid fa-triangle-exclamation"></i><span data-i18n="risk">Risk</span></a>
        <a href="trip-planner.html" class="tab-item"><i class="fa-solid fa-route"></i><span data-i18n="trip">Trip</span></a>
        <a href="search.html" class="tab-item"><i class="fa-solid fa-magnifying-glass"></i><span data-i18n="search">Search</span></a>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/storage.js"></script><script src="../js/units.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/risk-engine.js"></script>
    <script>
    (function(){
        // City facts only (name + coords) — weather is fetched live, never hardcoded
        const CITIES = [
            {name:'Mumbai',lat:19.076,lon:72.877},
            {name:'New Delhi',lat:28.613,lon:77.209},
            {name:'Bengaluru',lat:12.971,lon:77.594},
            {name:'Chennai',lat:13.082,lon:80.270},
            {name:'Kolkata',lat:22.572,lon:88.363},
            {name:'Hyderabad',lat:17.385,lon:78.486},
            {name:'Pune',lat:18.520,lon:73.856},
            {name:'Ahmedabad',lat:23.022,lon:72.571},
            {name:'Jaipur',lat:26.912,lon:75.787},
            {name:'Lucknow',lat:26.846,lon:80.946},
            {name:'Kochi',lat:9.931,lon:76.267},
            {name:'Goa',lat:15.490,lon:73.827},
            {name:'Shimla',lat:31.104,lon:77.173},
            {name:'Varanasi',lat:25.317,lon:83.006},
            {name:'Srinagar',lat:34.083,lon:74.797},
            {name:'San Francisco',lat:37.774,lon:-122.419},
            {name:'New York',lat:40.712,lon:-74.006},
            {name:'Los Angeles',lat:34.052,lon:-118.243},
            {name:'London',lat:51.507,lon:-0.127},
            {name:'Tokyo',lat:35.676,lon:139.650},
            {name:'Dubai',lat:25.204,lon:55.270},
            {name:'Singapore',lat:1.352,lon:103.819},
            {name:'Sydney',lat:-33.868,lon:151.209},
            {name:'Paris',lat:48.856,lon:2.352},
            {name:'Bangkok',lat:13.756,lon:100.501},
            {name:'Cairo',lat:30.044,lon:31.235},
            {name:'Seoul',lat:37.566,lon:126.978},
            {name:'Istanbul',lat:41.008,lon:28.978},
            {name:'São Paulo',lat:-23.550,lon:-46.633},
            {name:'Cape Town',lat:-33.924,lon:18.424},
        ];

        function riskColor(r){return{Low:'#22c55e',Moderate:'#eab308',High:'#f97316',Extreme:'#ef4444',Unknown:'#64748b'}[r]||'#64748b';}

        // Same resolution chain as WeatherAPI (private getApiKey is not reachable here)
        function resolveKey(){
            try { var o=localStorage.getItem('climateguard_api_key'); if(o) return o; } catch(e){}
            if(typeof window!=='undefined'&&window.CLIMATEGUARD_API_KEY) return window.CLIMATEGUARD_API_KEY;
            if(typeof CONFIG!=='undefined'&&CONFIG.API_KEY) return CONFIG.API_KEY;
            return '';
        }
        var API_KEY=resolveKey();

        function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        function makeIcon(c){
            var col=riskColor(c.risk);
            var temp=Units.format(c.temp);
            return L.divIcon({className:'weather-marker',
                html:'<div style="background:rgba(10,10,18,0.92);border:2px solid '+col+';border-radius:12px;padding:5px 9px;color:#fff;font-family:Plus Jakarta Sans,sans-serif;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,0.5);text-align:center;line-height:1.2;">'+temp+'<div style="font-size:8px;font-weight:500;opacity:0.65;">'+esc(c.name)+'</div></div>',
                iconSize:[85,42],iconAnchor:[42,21]});
        }

        // Center on India by default
        var map=L.map('map',{zoomControl:false}).setView([22,78],4);

        // Use a reliable dark tile provider
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
            attribution:'&copy; OpenStreetMap',subdomains:'abcd',maxZoom:18
        }).addTo(map);

        // Live OWM weather overlay (temperature by default); keyless installs stay on base map
        var LAYER_TILES={temp:'temp_new',wind:'wind_new',precip:'precipitation_new',clouds:'clouds_new'};
        function overlayUrl(key){return 'https://tile.openweathermap.org/map/'+LAYER_TILES[key]+'/{z}/{x}/{y}.png?appid='+API_KEY;}
        var overlay=null;
        if(API_KEY){
            overlay=L.tileLayer(overlayUrl('temp'),{maxZoom:18,opacity:0.6,attribution:'&copy; OpenWeatherMap'}).addTo(map);
        }

        // Demo badge: visible unless a key enables live data
        var badge=document.getElementById('mapDemoBadge');
        if(badge) badge.style.display=API_KEY?'none':'block';

        // Force map to resize properly
        setTimeout(function(){map.invalidateSize();},300);
        setTimeout(function(){map.invalidateSize();},1000);

        // Live marker data (bounded parallelism); keyless → placeholders, no fake numbers
        var liveCities=[];
        function demoCity(c){return{name:c.name,lat:c.lat,lon:c.lon,temp:null,wind:null,hum:null,cond:'',risk:'Unknown'};}
        async function fetchLive(c){
            try{
                var w=await WeatherAPI.getCurrentWeather(c.lat,c.lon);
                var m=(w&&w.weather)||{};
                var risk='Unknown';
                if(m.temp!=null&&typeof RiskEngine!=='undefined'){risk=RiskEngine.analyzeRisks(w).overallLevel.label;}
                return{name:c.name,lat:c.lat,lon:c.lon,temp:m.temp!=null?m.temp:null,wind:m.windSpeed!=null?m.windSpeed:null,hum:m.humidity!=null?m.humidity:null,cond:m.conditionText||'',risk:risk};
            }catch(e){return demoCity(c);}
        }
        async function pool(items,n,fn){
            var out=new Array(items.length),i=0;
            async function worker(){while(i<items.length){var idx=i++;out[idx]=await fn(items[idx]);}}
            var workers=[];for(var k=0;k<Math.min(n,items.length);k++)workers.push(worker());
            await Promise.all(workers);return out;
        }
        function addMarker(c){
            var m=L.marker([c.lat,c.lon],{icon:makeIcon(c)}).addTo(map);
            m.on('click',function(){showInfo(c);});
        }
        (async function boot(){
            liveCities=API_KEY?await pool(CITIES,6,fetchLive):CITIES.map(demoCity);
            liveCities.forEach(addMarker);
        })();

        // Info panel
        function showInfo(c){
            document.getElementById('infoName').textContent=c.name;
            document.getElementById('infoTemp').textContent=c.temp==null?'--':Units.format(c.temp);
            document.getElementById('infoWind').textContent=c.wind==null?'--':c.wind+' km/h';
            document.getElementById('infoHum').textContent=c.hum==null?'--':c.hum+'%';
            var re=document.getElementById('infoRisk');
            re.textContent=c.risk; re.style.color=riskColor(c.risk);
            document.getElementById('mapInfo').classList.add('show');
            document.getElementById('legend').style.display='none';
        }
        document.getElementById('closeInfo').onclick=function(){
            document.getElementById('mapInfo').classList.remove('show');
            document.getElementById('legend').style.display='';
        };

        // Locate button
        document.getElementById('locateBtn').onclick=function(){
            map.locate({setView:true,maxZoom:10});
        };
        map.on('locationfound',function(e){
            L.marker(e.latlng).addTo(map).bindPopup('You are here').openPopup();
        });

        // Layer buttons
        var legends={
            temp:{title:'Temperature (°C)',bg:'linear-gradient(to right,#3b82f6,#06b6d4,#22c55e,#eab308,#f97316,#ef4444)',labels:'-20|0|15|25|35|45+'},
            wind:{title:'Wind Speed (km/h)',bg:'linear-gradient(to right,#3b82f6,#22c55e,#eab308,#f97316,#ef4444)',labels:'0|20|40|60|80+'},
            precip:{title:'Precipitation (mm/h)',bg:'linear-gradient(to right,rgba(59,130,246,0.2),#60a5fa,#3b82f6,#7c3aed,#ef4444)',labels:'0|1|5|15|50+'},
            clouds:{title:'Cloud Cover (%)',bg:'linear-gradient(to right,rgba(255,255,255,0.1),rgba(255,255,255,0.4),rgba(255,255,255,0.7),#fff)',labels:'0|25|50|75|100'},
            risk:{title:'Risk Level',bg:'linear-gradient(to right,#22c55e,#eab308,#f97316,#ef4444)',labels:'Low|Moderate|High|Extreme'}
        };

        document.querySelectorAll('.map-btn[data-layer]').forEach(function(btn){
            if(!API_KEY){btn.disabled=true;btn.title='Requires API key';btn.style.opacity='0.4';}
            btn.addEventListener('click',function(){
                if(!overlay)return;
                // Toggle active
                document.querySelectorAll('.map-btn[data-layer]').forEach(function(b){b.classList.remove('active');});
                btn.classList.add('active');
                var key=btn.dataset.layer;
                // Swap the live tile overlay, then update legend
                overlay.setUrl(overlayUrl(key));
                var cfg=legends[key];
                if(cfg){
                    document.getElementById('legendTitle').textContent=cfg.title;
                    document.getElementById('legendBar').style.background=cfg.bg;
                    document.getElementById('legendLabels').innerHTML=cfg.labels.split('|').map(function(l){return '<span>'+l+'</span>';}).join('');
                }
            });
        });

        // Risk zones
        var riskCircles=[];
        var riskOn=false;
        document.getElementById('riskBtn').onclick=function(){
            if(riskOn){
                riskCircles.forEach(function(c){map.removeLayer(c);});
                riskCircles=[];
                riskOn=false;
                this.classList.remove('active');
            }else{
                liveCities.forEach(function(c){
                    if(c.risk!=='Low'&&c.risk!=='Unknown'){
                        var circle=L.circle([c.lat,c.lon],{
                            radius:c.risk==='High'?120000:80000,
                            color:riskColor(c.risk),fillColor:riskColor(c.risk),
                            fillOpacity:0.12,weight:2,dashArray:'8,4'
                        }).addTo(map);
                        circle.bindPopup('<b>'+c.name+'</b><br>Risk: '+c.risk+'<br>Temp: '+c.temp+'°');
                        riskCircles.push(circle);
                    }
                });
                riskOn=true;
                this.classList.add('active');
                var cfg=legends.risk;
                document.getElementById('legendTitle').textContent=cfg.title;
                document.getElementById('legendBar').style.background=cfg.bg;
                document.getElementById('legendLabels').innerHTML=cfg.labels.split('|').map(function(l){return '<span>'+l+'</span>';}).join('');
            }
        };
    })();
    </script>
</body>
</html>
