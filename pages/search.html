<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a12">
    <link rel="manifest" href="../manifest.json">
    <title>ClimateGuard - Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/animations.css"><link rel="stylesheet" href="../css/themes.css"><link rel="stylesheet" href="../css/weather-effects.css"><link rel="stylesheet" href="../css/extended.css">
    <style>
        .main-content { padding-bottom: calc(90px + env(safe-area-inset-bottom) + 40px) !important; overflow-y: auto !important; -webkit-overflow-scrolling: touch; }
        .search-hint { text-align: center; padding: 20px; color: var(--color-text-tertiary); font-size: 0.8rem; }
        .search-hint i { display: block; font-size: 2rem; margin-bottom: 8px; opacity: 0.4; }
    </style>
</head>
<body data-weather="clear_day">
    <div class="weather-background"><div class="weather-background__sky"></div><div class="weather-background__clouds"></div><div class="weather-background__particles"><canvas id="particleCanvas"></canvas></div><div class="weather-background__effects"></div><div class="weather-background__overlay"></div></div>
    <div class="app">
        <nav class="navbar"><div class="navbar__logo"><i class="fa-solid fa-shield-halved navbar__logo-icon"></i><span>ClimateGuard</span></div><div class="navbar__center"><span data-i18n="search">Search</span></div><div class="navbar__actions"><button class="icon-btn" onclick="window.location.href='index.html'" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div></nav>
        <main class="main-content" style="padding-top:var(--space-lg)">
            <div class="input-wrapper mb-md"><i class="fa-solid fa-magnifying-glass input-wrapper__icon"></i><input type="text" class="input" placeholder="Search any city worldwide..." id="searchInput" autofocus data-i18n-placeholder="searchPlaceholder"></div>
            <button class="btn btn--secondary btn--block mb-lg" id="useLocation" style="border-color:var(--color-accent);color:var(--color-accent)"><i class="fa-solid fa-location-crosshairs"></i><span data-i18n="useCurrentLocation">Use Current Location</span></button>
            <div id="searchResults" class="mb-md"></div>
            <section class="section" id="recentSection"><div class="section__header"><span class="section__title" data-i18n="recentSearches">Recent Searches</span></div><div id="recentSearches"></div></section>
            <section class="section"><div class="section__header"><span class="section__title" data-i18n="popularCities">Popular Cities</span></div>
                <div id="popularCitiesList"></div>
            </section>
            <div class="search-hint"><i class="fa-solid fa-magnifying-glass"></i>Search by city name, state, country or zip code<br>Powered by OpenWeatherMap Geocoding API</div>
        </main>
        <nav class="tab-bar"><a href="index.html" class="tab-item"><i class="fa-solid fa-house"></i><span data-i18n="home">Home</span></a><a href="map.html" class="tab-item"><i class="fa-solid fa-map-location-dot"></i><span data-i18n="map">Map</span></a><a href="risk-report.html" class="tab-item"><i class="fa-solid fa-triangle-exclamation"></i><span data-i18n="risk">Risk</span></a><a href="trip-planner.html" class="tab-item"><i class="fa-solid fa-route"></i><span data-i18n="trip">Trip</span></a><a href="search.html" class="tab-item active"><i class="fa-solid fa-magnifying-glass"></i><span data-i18n="search">Search</span></a></nav>
    </div>
    <script src="../js/config.js"></script><script src="../js/storage.js"></script><script src="../js/units.js"></script>
    <script src="../js/pwa.js"></script><script src="../js/i18n.js"></script><script src="../js/api.js"></script><script src="../js/particles.js"></script><script src="../js/weather-engine.js"></script><script src="../js/animation-engine.js"></script><script src="../js/theme.js"></script><script src="../js/risk-engine.js"></script><script src="../js/ui.js"></script><script src="../js/app.js"></script><script src="../js/settings-handler.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Render popular cities from DB
            const pop = document.getElementById('popularCitiesList');
            if (pop && typeof WeatherAPI !== 'undefined') {
                pop.innerHTML = WeatherAPI.getAllCities().map(c => `
                    <div class="list-item" data-lat="${c.lat}" data-lon="${c.lon}" data-name="${c.name}" data-region="${c.region}">
                        <div class="list-item__icon"><i class="fa-solid fa-city"></i></div>
                        <div class="list-item__content"><div class="list-item__title">${c.name}</div><div class="list-item__subtitle">${c.region}</div></div>
                        <i class="fa-solid fa-chevron-right" style="color:var(--color-text-tertiary)"></i>
                    </div>`).join('');
                pop.querySelectorAll('.list-item').forEach(item => {
                    item.addEventListener('click', () => {
                        Storage.set(Storage.KEYS.CURRENT_LOCATION, { lat: parseFloat(item.dataset.lat), lon: parseFloat(item.dataset.lon) });
                        Storage.addRecentLocation({ name: item.dataset.name, region: item.dataset.region, lat: parseFloat(item.dataset.lat), lon: parseFloat(item.dataset.lon) });
                        window.location.href = 'index.html';
                    });
                });
            }
        });
    </script>
</body>
</html>
