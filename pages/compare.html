<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a12">
    <meta name="description" content="ClimateGuard - Compare weather risks across multiple cities">
    <title>ClimateGuard - Multi-City Comparison</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/animations.css"><link rel="stylesheet" href="../css/themes.css"><link rel="stylesheet" href="../css/weather-effects.css"><link rel="stylesheet" href="../css/extended.css">
</head>
<body data-weather="clear_day">
    <div class="weather-background"><div class="weather-background__sky"></div><div class="weather-background__clouds"></div><div class="weather-background__particles"><canvas id="particleCanvas"></canvas></div><div class="weather-background__effects"></div><div class="weather-background__overlay"></div></div>
    <div class="app">
        <nav class="navbar"><div class="navbar__logo"><i class="fa-solid fa-shield-halved navbar__logo-icon"></i><span>ClimateGuard</span></div><div class="navbar__center"><span data-i18n="multiCity">Multi-City Compare</span></div><div class="navbar__actions"><button class="icon-btn" onclick="window.location.href='index.html'" aria-label="Home"><i class="fa-solid fa-house"></i></button></div></nav>
        <main class="main-content">
            <div class="page-header"><h1 class="page-header__title"><i class="fa-solid fa-chart-column" style="color:var(--color-accent);margin-right:8px"></i><span data-i18n="multiCity">Multi-City Comparison</span></h1><p class="page-header__subtitle">Compare weather risks across up to 5 cities</p></div>

            <section class="section">
                <div class="card card--no-hover" style="padding:20px">
                    <div id="cityInputs">
                        <div class="compare-input-row"><input class="input compare-city-input" placeholder="Enter city name..." style="padding-left:16px"><button class="icon-btn" onclick="addCityInput()" aria-label="Add city"><i class="fa-solid fa-plus"></i></button></div>
                        <div class="compare-input-row"><input class="input compare-city-input" placeholder="Enter city name..." style="padding-left:16px"></div>
                    </div>
                    <button class="btn btn--primary btn--block mt-md" id="compareBtn"><i class="fa-solid fa-magnifying-glass-chart"></i> <span data-i18n="compareCities">Compare Cities</span></button>
                </div>
            </section>

            <section class="section" id="comparisonResults" style="display:none">
                <div class="section__header"><span class="section__title" data-i18n="comparisonResults">Comparison Results</span></div>
                <div class="compare-table-wrap"><table class="compare-table" id="compareTable"></table></div>
                <div id="radarChartWrap" style="max-width:400px;margin:24px auto"><canvas id="radarChart"></canvas></div>
                <button class="download-btn mt-lg" id="exportCompareBtn"><i class="fa-solid fa-file-pdf"></i> <span data-i18n="exportComparison">Export Comparison PDF</span></button>
            </section>
        </main>
        <nav class="tab-bar"><a href="index.html" class="tab-item"><i class="fa-solid fa-house"></i><span data-i18n="home">Home</span></a><a href="map.html" class="tab-item"><i class="fa-solid fa-map-location-dot"></i><span data-i18n="map">Map</span></a><a href="risk-report.html" class="tab-item"><i class="fa-solid fa-triangle-exclamation"></i><span data-i18n="risk">Risk</span></a><a href="trip-planner.html" class="tab-item"><i class="fa-solid fa-route"></i><span data-i18n="trip">Trip</span></a><a href="search.html" class="tab-item"><i class="fa-solid fa-magnifying-glass"></i><span data-i18n="search">Search</span></a></nav>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="../js/config.js"></script><script src="../js/storage.js"></script><script src="../js/i18n.js"></script><script src="../js/api.js"></script><script src="../js/particles.js"></script><script src="../js/weather-engine.js"></script><script src="../js/animation-engine.js"></script><script src="../js/theme.js"></script><script src="../js/risk-engine.js"></script><script src="../js/ui.js"></script><script src="../js/app.js"></script><script src="../js/settings-handler.js"></script>
    <script>
        function addCityInput() {
            const container = document.getElementById('cityInputs');
            if (container.querySelectorAll('.compare-input-row').length >= 5) { UI.showNotification('Max 5 cities', 'warning'); return; }
            const row = document.createElement('div');
            row.className = 'compare-input-row';
            row.innerHTML = '<input class="input compare-city-input" placeholder="Enter city name..." style="padding-left:16px"><button class="icon-btn" onclick="this.parentElement.remove()" aria-label="Remove"><i class="fa-solid fa-minus"></i></button>';
            container.appendChild(row);
        }

        document.getElementById('compareBtn').addEventListener('click', async function() {
            const inputs = document.querySelectorAll('.compare-city-input');
            const cities = [];
            for (const inp of inputs) {
                const v = inp.value.trim();
                if (v.length < 2) continue;
                const results = await WeatherAPI.searchLocations(v);
                if (results.length) cities.push(results[0]);
            }
            if (cities.length < 2) { UI.showNotification('Enter at least 2 cities', 'warning'); return; }
            this.innerHTML = '<div class="spinner-sm"></div> Comparing...'; this.disabled = true;

            // Fetch weather for all cities in parallel with Promise.all
            const data = await Promise.all(cities.map(async (c) => {
                try {
                    const w = await WeatherAPI.getCurrentWeather(c.lat, c.lon);
                    const risk = (typeof RiskEngine !== 'undefined') ? RiskEngine.analyzeRisks(w) : { overallScore: 0, overallLevel: { label: '—' } };
                    return { city: c.name, region: c.region, weather: w.weather || w, risk };
                } catch { return { city: c.name, weather: {}, risk: { overallScore: 0, overallLevel: { label: '—' } } }; }
            }));

            renderComparison(data);
            this.innerHTML = '<i class="fa-solid fa-magnifying-glass-chart"></i> Compare Cities'; this.disabled = false;
            document.getElementById('comparisonResults').style.display = '';
        });

        function renderComparison(data) {
            const table = document.getElementById('compareTable');
            const safest = data.reduce((a, b) => a.risk.overallScore < b.risk.overallScore ? a : b);
            const riskiest = data.reduce((a, b) => a.risk.overallScore > b.risk.overallScore ? a : b);

            let html = '<thead><tr><th>City</th><th>Temp</th><th>Humidity</th><th>Wind</th><th>UV</th><th>AQI</th><th>Risk</th></tr></thead><tbody>';
            data.forEach(d => {
                const w = d.weather;
                const cls = d.city === safest.city ? 'safest' : (d.city === riskiest.city ? 'riskiest' : '');
                const badge = d.city === safest.city ? ' 🟢 Safest' : (d.city === riskiest.city ? ' 🔴 Riskiest' : '');
                html += `<tr class="${cls}"><td><strong>${UI.escapeHtml(d.city)}</strong>${badge}</td><td>${w.temp ?? '—'}°</td><td>${w.humidity ?? '—'}%</td><td>${w.windSpeed ?? '—'} km/h</td><td>${w.uvIndex ?? '—'}</td><td>${w.airQuality ?? '—'}</td><td style="color:${d.risk.overallLevel?.color || 'inherit'}">${d.risk.overallScore}/100 ${d.risk.overallLevel?.label || ''}</td></tr>`;
            });
            html += '</tbody>';
            table.innerHTML = html;

            // Radar chart
            if (typeof Chart !== 'undefined') {
                const ctx = document.getElementById('radarChart');
                if (ctx._chart) ctx._chart.destroy();
                const colors = ['#2bd4a7','#3b82f6','#f59e0b','#ef4444','#a855f7'];
                const chart = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: ['Temperature','Humidity','Wind','UV','AQI'],
                        datasets: data.map((d, i) => ({
                            label: d.city, data: [d.weather.temp||0, d.weather.humidity||0, d.weather.windSpeed||0, (d.weather.uvIndex||0)*10, d.weather.airQuality||0],
                            borderColor: colors[i%5], backgroundColor: colors[i%5]+'20', pointBackgroundColor: colors[i%5], borderWidth: 2
                        }))
                    },
                    options: { responsive: true, plugins: { legend: { labels: { color: 'rgba(255,255,255,0.7)' } } }, scales: { r: { grid: { color: 'rgba(255,255,255,0.1)' }, pointLabels: { color: 'rgba(255,255,255,0.7)', font: { size: 11 } }, ticks: { display: false } } } }
                });
                ctx._chart = chart;
            }
        }

        document.getElementById('exportCompareBtn')?.addEventListener('click', () => {
            if (!window.jspdf || !window.jspdf.jsPDF) {
                if (typeof UI !== 'undefined') UI.showNotification('PDF library failed to load. Check your connection and retry.', 'error');
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(10,10,18); doc.rect(0,0,210,30,'F');
            doc.setTextColor(43,212,167); doc.setFontSize(18); doc.text('ClimateGuard - City Comparison',20,20);
            doc.setTextColor(100,100,100); doc.setFontSize(10);
            let y = 40;
            const rows = document.querySelectorAll('#compareTable tbody tr');
            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                doc.setTextColor(0,0,0); doc.setFont('helvetica','bold');
                doc.text(cells[0]?.textContent || '', 20, y);
                doc.setFont('helvetica','normal'); doc.setTextColor(80,80,80);
                doc.text(`Temp: ${cells[1]?.textContent} | Humidity: ${cells[2]?.textContent} | Wind: ${cells[3]?.textContent} | UV: ${cells[4]?.textContent} | AQI: ${cells[5]?.textContent} | Risk: ${cells[6]?.textContent}`, 20, y+6);
                y += 16;
            });
            doc.save('ClimateGuard_Comparison.pdf');
            UI.showNotification('Comparison PDF downloaded!', 'success');
        });
    </script>
</body>
</html>
